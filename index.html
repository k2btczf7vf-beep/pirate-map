<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>나의 해적 지도</title><meta name="description" content="양피지 위에 나만의 지도를 그리는 작은 작업실"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%231c353b'/%3E%3Ctext x='8' y='29' font-size='26' fill='%23e3b873'%3EM%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><span class="monogram">M</span><div><h1>나의 해적 지도</h1><span class="sub">THE CARTOGRAPHER’S DESK</span></div></div><button id="export" class="primary">PNG로 저장</button></header>
<main><aside><div class="section-title">그리기 도구</div><div class="tools" role="group" aria-label="그리기 도구"><button data-tool="pen" class="selected">✎ 자유선</button><button data-tool="line">╱ 직선</button><button data-tool="coast">≈ 해안선</button><button data-tool="route">┄ 항로</button><button data-tool="eraser">◻ 지우개</button><button data-tool="text">T 지명</button></div><label for="color">잉크 색상</label><div class="colors"><button class="swatch" data-color="#493421" style="--color:#493421" aria-label="갈색"></button><button class="swatch" data-color="#213e48" style="--color:#213e48" aria-label="바다색"></button><button class="swatch" data-color="#42714a" style="--color:#42714a" aria-label="초록색"></button><button class="swatch" data-color="#ac463c" style="--color:#ac463c" aria-label="빨간색"></button><input id="color" type="color" value="#493421" aria-label="사용자 잉크 색상"></div><label for="width">선 굵기 <output id="widthValue">3</output></label><input id="width" type="range" min="1" max="30" value="3"><div id="textControls" hidden><label for="place">지명</label><input id="place" type="text" placeholder="예: 안개 숲" maxlength="80"><label for="fontSize">글자 크기</label><input id="fontSize" type="range" min="12" max="48" value="22"></div><hr><label for="backgroundMode">지도 배경</label><select id="backgroundMode"><option value="blank">빈 양피지 · 직접 그리기</option><option value="reference">참고 지도 · 위에 그리기</option></select><label class="frame-label"><input id="frame" type="checkbox" checked> 고풍스러운 테두리</label><div class="section-title">편집</div><div class="history"><button id="undo" disabled>↶ 실행 취소</button><button id="redo" disabled>↷ 다시 실행</button></div><button id="clear" class="clear">그림 모두 지우기</button><div class="hint"><strong>당신만의 세계를 그려 보세요.</strong><p>섬의 윤곽은 해안선으로, 배가 다니는 길은 점선 항로로 그려 보세요. 지명 도구는 입력 후 지도에서 원하는 곳을 누르면 됩니다.</p><p>컴퓨터와 터치 화면에서 사용할 수 있습니다.</p></div></aside><section class="workspace" aria-label="지도 작업 공간"><div class="workspace-top"><span>이미지 1 · 양피지</span><span id="toolLabel">자유선 도구</span></div><div class="board"><div class="paper"><div class="background-wrap"><img id="background" src="assets/parchment.png" alt="빈 양피지 지도 배경"></div><canvas id="drawing" width="958" height="718" aria-label="지도 그리기 캔버스"></canvas></div></div><footer><span id="status" role="status">양피지 위에 드래그해서 그리세요.</span><span>Ctrl / ⌘ + Z · 실행 취소</span></footer></section></main><script src="app.js"></script></body></html>
